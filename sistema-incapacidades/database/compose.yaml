services:
  postgres:
    image: postgres:16-alpine
    container_name: incapacidades-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incapacidades}
      POSTGRES_USER: ${POSTGRES_USER:-incapacidades_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incapacidades_user} -d ${POSTGRES_DB:-incapacidades}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
